name: Release quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Export and Worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release artifact
        run: npm run release:check

      - name: Exercise the Cloudflare runtime contract
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8788 --show-interactive-dev-session=false > /tmp/portfolio-worker.log 2>&1 &
          worker_pid=$!
          cleanup() { kill "$worker_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/portfolio-worker.log
              exit 1
            fi
            sleep 1
          done

          if ! npm run deployment:check -- http://127.0.0.1:8788; then
            cat /tmp/portfolio-worker.log
            exit 1
          fi
